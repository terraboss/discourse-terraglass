ja:
  theme_metadata:
    description: "ヘッダー、サイドバー、メニュー、ダイアログ、カードにすりガラス風の見た目を適用し、調和したライトとダークのカラースキームを備えています。"
    settings:
      corner_radius: "ボタン、カード、入力欄の角の丸み（ピクセル、0 = 角丸なし）。"
      topic_list_zebra: "トピック一覧にさりげないゼブラ縞とホバー効果を付けます。"
      hide_subcategories_in_hamburger: "従来のハンバーガーメニューでサブカテゴリを非表示にします。サイドバーが有効なら通常は不要です。"
      composer_accent: "エディタのサイズ変更ハンドルをアクセントカラーで表示します。"
      hide_uncategorized_in_menu: "ハンバーガーメニューから「カテゴリなし」の項目を非表示にします（トピックは一覧に表示されたままです）。"
      transparent_header: "ぼかし効果付きの半透明ヘッダー（コンテンツがうっすら透けて見えます）。"
      header_opacity: "ヘッダーの不透明度（パーセント、100 = 不透明、小さいほど透明）。"
      header_blur: "透明ヘッダーの背後の背景ぼかしの強さ（ピクセル）。"
      header_tint: "ヘッダーをアクセントカラーで色付けします。オフにするとヘッダーはニュートラルのままです。"
      header_tint_source:
        description: "auto = 現在のカラースキームのアクセントカラーに従います（ライト／ダークに自動で対応）。custom = 下の色を使用します。"
        choices:
          auto: "自動（アクセントカラー）"
          custom: "カスタムカラー"
      header_tint_color: "ソースが custom のときに使う色付けの色。任意の CSS カラーを指定できます（例：#c8401f）。"
      header_tint_strength: "色付けの強さ（パーセント、0 = 色付けなし、100 = 単色）。"
      pretty_tags: "タグを矢印／旗の形のラベルで表示します（色は現在のカラースキームに従い、ダークモードにも対応）。"
      pretty_videos: "埋め込み動画（YouTube などの動画 onebox）をすべてのデバイスで 16:9 の固定比率で表示します。"
      pretty_oneboxes: "リンクプレビュー（Wikipedia などの onebox）を、細い枠線付きの角丸カードとして X/Twitter 風に表示します。"
      onebox_radius: "onebox カードの角の半径（ピクセル）。"
      transparent_sidebar: "ぼかし効果付きの半透明サイドバー／ハンバーガーメニュー。ヘッダーとそろえます。"
      sidebar_opacity: "サイドバーの不透明度（パーセント）。メニュー項目が読みやすいよう、ヘッダーより高めにします。"
      sidebar_blur: "サイドバーの背後の背景ぼかしの強さ（ピクセル）。"
      glass_surfaces: "ドロップダウンメニュー、ダイアログ、ユーザーカード、浮遊コントロールなどの浮いた面に、すりガラス風の見た目を適用します。"
      menu_opacity: "ガラス風ドロップダウンメニューの不透明度（パーセント）。低いほどページが透けて見えます。"
      menu_blur: "ガラス風ドロップダウンメニューの背後の背景ぼかしの強さ（ピクセル）。"
      dialog_opacity: "ガラス風ダイアログの不透明度（パーセント）。高いほどフォームや文字が読みやすくなります。"
      dialog_blur: "ガラス風ダイアログの背後の背景ぼかしの強さ（ピクセル）。"

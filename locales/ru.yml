ru:
  theme_metadata:
    description: "Эффект матового стекла для шапки, боковой панели, меню, диалогов и карточек с подобранными светлой и тёмной цветовыми схемами."
    settings:
      corner_radius: "Скругление углов кнопок, карточек и полей ввода в пикселях (0 = прямые углы)."
      topic_list_zebra: "Едва заметная зебра и подсветка при наведении в списке тем."
      hide_subcategories_in_hamburger: "Скрывать подкатегории в классическом меню-гамбургере. Обычно не нужно, если включена боковая панель."
      composer_accent: "Окрашивать маркер изменения размера редактора в акцентный цвет."
      hide_uncategorized_in_menu: "Скрывать пункт «Без категории» в меню-гамбургере (темы остаются видны в списках)."
      transparent_header: "Полупрозрачная шапка с эффектом размытия (содержимое слегка просвечивает)."
      header_opacity: "Непрозрачность шапки в процентах (100 = непрозрачная, меньше = прозрачнее)."
      header_blur: "Сила размытия фона за прозрачной шапкой, в пикселях."
      header_tint: "Подкрашивать шапку акцентным цветом. Если выключено, шапка остаётся нейтральной."
      header_tint_source:
        description: "auto = следует акцентному цвету активной цветовой схемы (подстраивается под светлую и тёмную). custom = использует цвет ниже."
        choices:
          auto: "Автоматически (акцентный цвет)"
          custom: "Свой цвет"
      header_tint_color: "Цвет подкраски, когда источник установлен в custom. Любой CSS-цвет, например #c8401f."
      header_tint_strength: "Насколько заметна подкраска, в процентах (0 = без подкраски, 100 = сплошной цвет)."
      pretty_tags: "Показывать теги в виде меток-стрелок/флажков (цвета следуют активной цветовой схеме, включая тёмную)."
      pretty_videos: "Показывать встроенные видео (YouTube и другие видео-oneboxes) в фиксированном формате 16:9 на любом устройстве."
      pretty_oneboxes: "Показывать превью ссылок (oneboxes, например Википедия) в виде скруглённых карточек с тонкой рамкой в стиле X/Twitter."
      onebox_radius: "Радиус скругления карточек onebox, в пикселях."
      transparent_sidebar: "Полупрозрачная боковая панель/меню-гамбургер с эффектом размытия в тон шапке."
      sidebar_opacity: "Непрозрачность боковой панели в процентах. Выше, чем у шапки, чтобы пункты меню оставались читаемыми."
      sidebar_blur: "Сила размытия фона за боковой панелью, в пикселях."
      glass_surfaces: "Эффект матового стекла для плавающих элементов: выпадающих меню, диалогов, карточек пользователей и плавающих кнопок."
      menu_opacity: "Непрозрачность стеклянных выпадающих меню в процентах. Чем меньше, тем сильнее просвечивает страница."
      menu_blur: "Сила размытия фона за стеклянными выпадающими меню, в пикселях."
      dialog_opacity: "Непрозрачность стеклянных диалогов в процентах. Чем выше, тем легче читать формы и текст на них."
      dialog_blur: "Сила размытия фона за стеклянными диалогами, в пикселях."

ar:
  theme_metadata:
    description: "مظهر الزجاج المصنفر للترويسة والشريط الجانبي والقوائم وصناديق الحوار والبطاقات، مع نظامي ألوان فاتح وداكن متناسقين."
    settings:
      corner_radius: "استدارة زوايا الأزرار والبطاقات وحقول الإدخال بالبكسل (0 = زوايا حادة)."
      topic_list_zebra: "خطوط متبادلة خفيفة (زيبرا) وتأثير عند تمرير المؤشر في قائمة المواضيع."
      hide_subcategories_in_hamburger: "إخفاء الفئات الفرعية في قائمة الهامبرغر الكلاسيكية. غالبًا غير ضروري عند تفعيل الشريط الجانبي."
      composer_accent: "تلوين مقبض تغيير حجم المحرر بلون التمييز."
      hide_uncategorized_in_menu: "إخفاء عنصر «غير مصنّف» من قائمة الهامبرغر (تبقى المواضيع ظاهرة في القوائم)."
      transparent_header: "ترويسة شبه شفافة مع تأثير ضبابي (يظهر المحتوى خلفها بشكل خافت)."

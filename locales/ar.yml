        choices:
          auto: "تلقائي (لون التمييز)"
          custom: "لون مخصص"
      header_tint_color: "لون التلوين المستخدم عندما يكون المصدر custom. يمكن استخدام أي لون CSS، مثل #c8401f."
      header_tint_strength: "قوة ظهور التلوين بالنسبة المئوية (0 = بلا تلوين، 100 = لون ممتلئ)."
      pretty_tags: "عرض الوسوم على شكل أسهم/أعلام (تتبع الألوان نظام الألوان النشط، بما في ذلك الوضع الداكن)."
      pretty_videos: "عرض الفيديوهات المضمّنة (يوتيوب وغيره من oneboxes الفيديو) بنسبة ثابتة 16:9 على جميع الأجهزة."
      pretty_oneboxes: "عرض معاينات الروابط (oneboxes مثل ويكيبيديا) كبطاقات مستديرة بحدود رفيعة، بأسلوب قريب من X/Twitter."
      onebox_radius: "نصف قطر زوايا بطاقات onebox بالبكسل."
      transparent_sidebar: "شريط جانبي/قائمة هامبرغر شبه شفافة مع تأثير ضبابي، متناسقة مع الترويسة."
      sidebar_opacity: "عتامة الشريط الجانبي بالنسبة المئوية. أعلى من عتامة الترويسة لتبقى عناصر القائمة مقروءة."
      sidebar_blur: "قوة ضبابية الخلفية خلف الشريط الجانبي، بالبكسل."
      glass_surfaces: "مظهر الزجاج المصنفر للأسطح العائمة مثل القوائم المنسدلة وصناديق الحوار وبطاقات المستخدمين وعناصر التحكم العائمة."
      menu_opacity: "عتامة القوائم المنسدلة الزجاجية بالنسبة المئوية. القيمة الأقل تُظهر المزيد من الصفحة."
      menu_blur: "قوة ضبابية الخلفية خلف القوائم المنسدلة الزجاجية، بالبكسل."
      dialog_opacity: "عتامة صناديق الحوار الزجاجية بالنسبة المئوية. القيمة الأعلى تجعل النماذج والنصوص أسهل قراءة."
      dialog_blur: "قوة ضبابية الخلفية خلف صناديق الحوار الزجاجية، بالبكسل."
